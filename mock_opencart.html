<!DOCTYPE html>
<html dir="ltr" lang="tr">
<head>
<meta charset="UTF-8" />
<title>Mock OpenCart - Sipariş ve EczaneVPN Testi</title>
<!-- Bootstrap & Font Awesome mocks for styling context -->
<link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/3.3.7/css/bootstrap.min.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
<link rel="stylesheet" href="styles.css">
<style>
    body { background-color: #f5f5f5; padding: 20px; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    #column-left { background: #2c3e50; color: white; padding: 15px; border-radius: 5px; margin-bottom: 20px; }
    #profile { display: flex; align-items: center; gap: 10px; }
    #profile h4 { margin: 0; color: #ecf0f1; font-weight: bold; }
    #profile small { color: #bdc3c7; }
    #content { background: white; padding: 25px; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.08); }
    textarea { resize: vertical; }
    .customer-panel { background: #fafafa; border: 1px solid #e0e0e0; border-radius: 6px; padding: 15px; margin-bottom: 20px; }
</style>
</head>
<body>

<div id="container" class="container-fluid">
  <!-- Sol Menü / Personel Profili (OpenCart Simülasyonu) -->
  <div class="row">
    <div class="col-sm-3">
      <nav id="column-left">
        <div id="profile">
          <i class="fa fa-user-circle fa-2x"></i>
          <div>
            <h4>İsa Çılgın</h4>
            <small>yönetici</small>
          </div>
        </div>
      </nav>
    </div>

    <!-- Ana İçerik -->
    <div class="col-sm-9">
      <div id="content">
        <div class="row">
            <div class="col-sm-12">
                <h3><i class="fa fa-shopping-cart"></i> Sipariş Detayı (#123990)</h3>
                <hr>
            </div>
        </div>

        <!-- Müşteri ve Telefon Bilgileri -->
        <div class="customer-panel">
            <h4><i class="fa fa-user"></i> Müşteri Bilgileri</h4>
            <table class="table table-bordered">
                <tr>
                    <td style="width: 25%;"><strong>Müşteri Adı:</strong></td>
                    <td>Yüsra Akgül</td>
                </tr>
                <tr>
                    <td><strong>Cep Telefonu:</strong></td>
                    <td id="user-telephone">0533 195 96 02</td>
                    <input type="hidden" id="myInput" value="05331959602">
                </tr>
                <tr>
                    <td><strong>İş Telefonu:</strong></td>
                    <td id="work-telephone">0416 216 36 44</td>
                    <input type="hidden" id="myInput2" value="04162163644">
                </tr>
            </table>
        </div>

        <!-- Müşteri Geçmişi Tablosu (Netsipp buton enjeksiyon testi için) -->
        <div id="history_customer" style="margin-bottom: 20px;">
            <h4><i class="fa fa-history"></i> Müşteri İletişim Geçmişi</h4>
            <table class="table table-striped table-hover">
                <thead>
                    <tr>
                        <th>Tarih</th>
                        <th>Not / Numara</th>
                    </tr>
                </thead>
                <tbody>
                    <tr>
                        <td>15/10/2026</td>
                        <td>Teknik Destek &gt; eczanevpn kurulum isteniyor || Çağrı No: 0535-855-53-56</td>
                    </tr>
                </tbody>
            </table>
        </div>

        <!-- Açıklama Alanı & Eklenti Paneli Hedefi -->
        <div class="row">
          <div class="col-sm-12">
            <div class="tab-pane" id="tab-history_customer">
              <div class="form-group">
                <label class="control-label" for="input-comment">Müşteri Notu / Açıklama:</label>
                <textarea name="comment" rows="6" placeholder="Açıklama veya sesli not..." id="input-comment" class="form-control"></textarea>
              </div>
              <div class="text-right" style="margin-top: 10px;">
                <button id="button-history_customer" class="btn btn-primary"><i class="fa fa-plus-circle"></i> Müşteri Geçmişi Ekle</button>
              </div>
            </div>
          </div>
        </div>

      </div>
    </div>
  </div>
</div>

<!-- Eklenti scripti yerel simülasyon testi için -->
<script src="content.js"></script>
</body>
</html>
